name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed package version
        required: true
        type: string
      verify_only:
        description: Verify an already uploaded version without publishing it again
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      HUSKY: '0'
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Require the full CI matrix for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 20
        run: |
          node --input-type=module <<'JS'
          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs?head_sha=${process.env.GITHUB_SHA}&event=push&per_page=20`;
          for (let attempt = 0; attempt < 75; attempt++) {
            const response = await fetch(endpoint, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' } });
            if (!response.ok) throw new Error(`Cannot verify CI: HTTP ${response.status}`);
            const result = await response.json();
            const run = result.workflow_runs.find(run => run.path === '.github/workflows/ci.yml');
            if (run?.status === 'completed') {
              if (run.conclusion !== 'success') throw new Error(`CI matrix did not pass: ${run.conclusion}`);
              console.log('The full CI matrix passed for this exact commit.');
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 15000));
          }
          throw new Error('CI matrix did not complete within the release deadline.');
          JS
      - run: bun install --frozen-lockfile
      - run: bun run release:metadata
      - name: Verify reviewed version and public repository
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync('packages/svelte-imageway/package.json'));
          if (p.version !== process.env.EXPECTED_VERSION || !/^\d+\.\d+\.\d+$/.test(p.version)) throw new Error('The exact reviewed release version is required.');
          if (p.repository.url !== `https://github.com/${process.env.GITHUB_REPOSITORY}.git`) throw new Error('Repository metadata does not match this workflow.');
          JS
      - run: bun run check
      - run: bun run format:check
      - run: bun run package:check
      - run: bun run check:budget
      # Bun handles installs, builds, scripts and tar creation. Its publish command
      # cannot generate provenance; npm is used only to publish the audited tarball.
      - name: Publish audited package with provenance
        if: ${{ !inputs.verify_only }}
        env:
          # Only needed to create the initial package; removed after bootstrap.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: npm publish .local/pack/svelte-imageway-${EXPECTED_VERSION}.tgz --tag latest --access public --provenance

      - name: Verify public registry version, tag, integrity and provenance
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          const name = 'svelte-imageway';
          const version = process.env.EXPECTED_VERSION;
          for (let attempt = 0; attempt < 120; attempt++) {
            const response = await fetch(`https://registry.npmjs.org/${name}?verify=${Date.now()}`, { headers: { 'Cache-Control': 'no-cache' } });
            if (!response.ok) throw new Error(`Registry verification failed: HTTP ${response.status}`);
            const manifest = await response.json();
            const published = manifest.versions?.[version];
            if (published && manifest['dist-tags']?.latest === version) {
              if (!published.dist?.attestations?.url) throw new Error('Published package is missing provenance attestations.');
              const tar = await fetch(published.dist.tarball);
              if (!tar.ok) throw new Error(`Cannot download registry tarball: HTTP ${tar.status}`);
              const integrity = 'sha512-' + createHash('sha512').update(Buffer.from(await tar.arrayBuffer())).digest('base64');
              if (integrity !== published.dist.integrity) throw new Error('Registry tarball integrity mismatch.');
              console.log(`${name}@${version} is publicly available under latest, with matching integrity and provenance.`);
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('npm accepted the upload but the operational version is not public under latest. Check staged publication; a placeholder is not a completed release.');
          JS
