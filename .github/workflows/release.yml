name: Release preview
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed package version (0.x preview only)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      HUSKY: '0'
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run release:metadata
      - name: Verify reviewed preview version and public repository
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync('packages/svelte-imageway/package.json'));
          if (p.version !== process.env.EXPECTED_VERSION || !/^0\./.test(p.version)) throw new Error('Only the reviewed 0.x preview is enabled; 1.0 needs its acceptance gate.');
          if (p.repository.url !== `https://github.com/${process.env.GITHUB_REPOSITORY}.git`) throw new Error('Repository metadata does not match this workflow.');
          JS
      - run: bun run check
      - run: bun run format:check
      - run: bun run package:check
      - run: bun run check:budget
      # Bun handles installs, builds, scripts and tar creation. Its publish command
      # cannot generate provenance; npm is used only to publish the audited tarball.
      - name: Publish audited preview with provenance
        env:
          # Only needed to create the initial package; removed after bootstrap.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: npm publish .local/pack/svelte-imageway-${EXPECTED_VERSION}.tgz --tag next --access public --provenance
